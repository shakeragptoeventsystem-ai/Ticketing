<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>PTO Camera Test</title>
<!-- Standalone smoke test: no Apps Script, no sign-in, no libraries. Proves whether
     a plain top-level HTTPS page can access the camera on this device/browser
     before investing in the full external-scanner build-out. -->
<style>
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#F4F7F8;color:#1E2A33;padding:20px}
  .wrap{max-width:480px;margin:0 auto}
  h1{font-size:18px;color:#13294B}
  .btn{display:block;width:100%;padding:15px;font-size:16px;font-weight:700;border:none;border-radius:12px;background:#028090;color:#fff;cursor:pointer;margin-top:14px}
  .btn:disabled{opacity:.5}
  #video{width:100%;border-radius:12px;background:#000;margin-top:14px;display:none}
  .status{margin-top:14px;padding:14px;border-radius:10px;font-weight:700;display:none}
  .status.pass{background:#E4F5EE;color:#1E8449;display:block}
  .status.fail{background:#FADBD8;color:#B00020;display:block}
  .muted{color:#5A6B76;font-size:13px}
  textarea{width:100%;height:140px;margin-top:10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;padding:8px;border:1px solid #D3DEE4;border-radius:8px}
</style>
</head>
<body>
<div class="wrap">
  <h1>PTO Camera Test</h1>
  <p class="muted">Open this page's real URL directly (not a preview/share sheet), then tap the button.</p>
  <button class="btn" id="btnTest">Test camera</button>
  <video id="video" autoplay playsinline muted></video>
  <div class="status" id="status"></div>
  <p class="muted" id="copyHint" style="display:none">Diagnostic details (tap to select all, then copy/paste back):</p>
  <textarea id="diag" readonly style="display:none" onclick="this.select()"></textarea>
</div>
<script>
function $(id){return document.getElementById(id);}
function setStatus(pass,message){var s=$('status');s.className='status '+(pass?'pass':'fail');s.textContent=(pass?'PASS: ':'FAIL: ')+message;}
function showDiag(obj){$('copyHint').style.display='block';var d=$('diag');d.style.display='block';d.value=JSON.stringify(obj,null,2);}
function startTest(){
  var btn=$('btnTest');btn.disabled=true;btn.textContent='Requesting camera…';
  var base={href:location.href,origin:location.origin,protocol:location.protocol,isSecureContext:window.isSecureContext,hasMediaDevices:!!navigator.mediaDevices,hasGetUserMedia:!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia),userAgent:navigator.userAgent};
  if(!window.isSecureContext||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    setStatus(false,'This browser will not even offer a camera prompt here.');showDiag(base);btn.disabled=false;btn.textContent='Test camera';btn.onclick=startTest;return;
  }
  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}}).then(function(stream){
    var v=$('video');v.style.display='block';v.srcObject=stream;
    setStatus(true,'Camera stream received. If you can see live video above, this architecture works on this device.');
    showDiag(Object.assign({result:'stream received'},base));
    btn.textContent='Stop camera';btn.disabled=false;
    btn.onclick=function(){stream.getTracks().forEach(function(t){t.stop();});v.style.display='none';v.srcObject=null;btn.textContent='Test camera';btn.onclick=startTest;};
  }).catch(function(err){
    setStatus(false,(err&&err.name||'Error')+': '+(err&&err.message||err));
    showDiag(Object.assign({errorName:err&&err.name,errorMessage:err&&err.message},base));
    btn.disabled=false;btn.textContent='Test camera';btn.onclick=startTest;
  });
}
$('btnTest').onclick=startTest;
</script>
</body>
</html>
